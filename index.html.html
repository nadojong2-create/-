<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목회자 인문학 서재 - Pastor's Humanities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <style>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');
        
        :root {
            --primary: #2d3748;
            --accent: #b7791f; /* 금색/황동색 톤으로 클래식한 느낌 강조 */
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
        }

        .serif {
            font-family: 'Noto Serif KR', serif;
        }

        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        /* 부드러운 탭 전환을 위한 클래스 */
        .tab-active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .nav-button {
            transition: all 0.2s ease;
        }

        .nav-button:active {
            transform: scale(0.9);
        }

        /* 도서 리스트 애니메이션 */
        .book-item {
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }

        .book-item:hover {
            border-left-color: var(--accent);
            background-color: #fffaf0;
        }
    </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen flex flex-col border-x border-gray-100 shadow-2xl">

    <!-- Header: Classic & Sophisticated -->
    <header class="p-6 bg-slate-800 text-white shadow-md relative overflow-hidden shrink-0">
        <div class="absolute top-0 right-0 p-4 opacity-10">
            <i data-lucide="library" class="w-24 h-24"></i>
        </div>
        <div class="relative z-10">
            <h1 class="serif text-2xl font-bold tracking-tight">목회자 인문학 서재</h1>
            <p class="text-xs text-slate-300 mt-1 opacity-80 uppercase tracking-widest">Beyond Theology to Humanities</p>
            
            <div class="mt-6 flex items-center justify-between bg-white/10 p-3 rounded-lg backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full border-2 border-amber-500 overflow-hidden bg-slate-600">
                        <i data-lucide="user" class="w-full h-full p-2"></i>
                    </div>
                    <div>
                        <p class="text-sm font-bold">오 목사님</p>
                        <p class="text-[10px] text-amber-400">인문 소양 3단계 : 탐구자</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-xs block text-slate-400">이번 달 읽은 페이지</span>
                    <span class="text-xl font-bold text-amber-400">1,240<small class="text-xs font-normal ml-1">p</small></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 p-5 space-y-6 pb-24 overflow-y-auto">
        <!-- Default Content (Home) will be rendered here -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 flex justify-around py-3 px-2 shadow-2xl z-50">
        <button onclick="changeTab('home')" id="nav-home" class="nav-button flex flex-col items-center gap-1 text-amber-700">
            <i data-lucide="book-open" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">커리큘럼</span>
        </button>
        <button onclick="changeTab('meditation')" id="nav-meditation" class="nav-button flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="pen-tool" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">사유 노트</span>
        </button>
        <button onclick="changeTab('calendar')" id="nav-calendar" class="nav-button flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="calendar" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">학습 일정</span>
        </button>
        <button onclick="changeTab('lounge')" id="nav-lounge" class="nav-button flex flex-col items-center gap-1 text-gray-400">
            <i data-lucide="messages-square" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">지혜의 광장</span>
        </button>
    </nav>

    <script>
        const content = document.getElementById('app-content');
        
        function initIcons() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                setTimeout(initIcons, 100);
            }
        }

        window.onload = () => {
            renderHome();
            initIcons();
        };

        function changeTab(tab) {
            const tabs = ['home', 'meditation', 'calendar', 'lounge'];
            tabs.forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                if (el) {
                    el.classList.remove('text-amber-700');
                    el.classList.add('text-gray-400');
                }
            });

            const activeNav = document.getElementById(`nav-${tab}`);
            if (activeNav) {
                activeNav.classList.remove('text-gray-400');
                activeNav.classList.add('text-amber-700');
            }

            if(tab === 'home') renderHome();
            else if(tab === 'meditation') renderMeditation();
            else if(tab === 'calendar') renderCalendar();
            else if(tab === 'lounge') renderLounge();

            initIcons();
        }

        function renderHome() {
            content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="serif text-xl font-bold">이달의 인문학 플랜</h3>
                        <span class="text-xs text-amber-600 font-bold bg-amber-50 px-2 py-1 rounded">진행률 65%</span>
                    </div>

                    <!-- Category Tabs -->
                    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                        <button class="shrink-0 px-4 py-2 bg-slate-800 text-white rounded-full text-xs font-medium">전체</button>
                        <button class="shrink-0 px-4 py-2 bg-slate-100 text-slate-500 rounded-full text-xs font-medium">문학</button>
                        <button class="shrink-0 px-4 py-2 bg-slate-100 text-slate-500 rounded-full text-xs font-medium">역사</button>
                        <button class="shrink-0 px-4 py-2 bg-slate-100 text-slate-500 rounded-full text-xs font-medium">철학</button>
                        <button class="shrink-0 px-4 py-2 bg-slate-100 text-slate-500 rounded-full text-xs font-medium">예술</button>
                    </div>

                    <!-- Curriculum List -->
                    <div class="space-y-3">
                        <div class="book-item bg-white p-4 rounded-xl card-shadow border border-gray-50 flex gap-4">
                            <div class="w-16 h-24 bg-slate-200 rounded shadow-inner flex items-center justify-center text-slate-400 italic text-[10px] text-center p-1">
                                [도서 이미지]
                            </div>
                            <div class="flex-1">
                                <span class="text-[10px] text-amber-600 font-bold uppercase tracking-tighter">[철학]</span>
                                <h4 class="font-bold text-sm leading-tight mt-1">니코마코스 윤리학</h4>
                                <p class="text-xs text-gray-500 mt-1 italic">아리스토텔레스</p>
                                <div class="mt-3 flex items-center gap-2">
                                    <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                        <div class="w-3/4 h-full bg-amber-500"></div>
                                    </div>
                                    <span class="text-[10px] text-gray-400 font-bold">75%</span>
                                </div>
                            </div>
                        </div>

                        <div class="book-item bg-white p-4 rounded-xl card-shadow border border-gray-50 flex gap-4">
                            <div class="w-16 h-24 bg-slate-200 rounded shadow-inner flex items-center justify-center text-slate-400 italic text-[10px] text-center p-1">
                                [도서 이미지]
                            </div>
                            <div class="flex-1">
                                <span class="text-[10px] text-blue-600 font-bold uppercase tracking-tighter">[문학]</span>
                                <h4 class="font-bold text-sm leading-tight mt-1">카라마조프 가의 형제들</h4>
                                <p class="text-xs text-gray-500 mt-1 italic">도스토옙스키</p>
                                <div class="mt-3 flex items-center gap-2">
                                    <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                        <div class="w-1/4 h-full bg-blue-500"></div>
                                    </div>
                                    <span class="text-[10px] text-gray-400 font-bold">25%</span>
                                </div>
                            </div>
                        </div>

                        <div class="book-item bg-white p-4 rounded-xl card-shadow border border-gray-50 flex gap-4">
                            <div class="w-16 h-24 bg-slate-200 rounded shadow-inner flex items-center justify-center text-slate-400 italic text-[10px] text-center p-1">
                                [도서 이미지]
                            </div>
                            <div class="flex-1">
                                <span class="text-[10px] text-green-600 font-bold uppercase tracking-tighter">[역사]</span>
                                <h4 class="font-bold text-sm leading-tight mt-1">역사란 무엇인가</h4>
                                <p class="text-xs text-gray-500 mt-1 italic">E.H. 카</p>
                                <div class="mt-3 flex items-center gap-2">
                                    <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                        <div class="w-0 h-full bg-green-500"></div>
                                    </div>
                                    <span class="text-[10px] text-gray-400 font-bold">시작전</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Daily Wisdom Quote -->
                    <div class="bg-amber-50 p-5 rounded-2xl border border-amber-100 mt-4 italic">
                        <i data-lucide="quote" class="text-amber-200 w-8 h-8 mb-2"></i>
                        <p class="serif text-sm text-amber-900 leading-relaxed">
                            "성경만 아는 사람은 성경도 모르는 사람이다."
                        </p>
                        <p class="text-[10px] text-amber-700 mt-2 font-bold not-italic text-right">- C.S. 루이스</p>
                    </div>
                </div>
            `;
        }

        function renderMeditation() {
            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="serif text-xl font-bold">인문학 사유 노트</h3>
                    <button class="bg-slate-800 text-white p-2 rounded-full shadow-lg"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-xl card-shadow border-l-4 border-amber-600">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded uppercase">철학적 사유</span>
                            <span class="text-[10px] text-gray-400">2024.10.24</span>
                        </div>
                        <h4 class="font-bold text-sm mb-2">아리스토텔레스의 '중용'과 목회적 돌봄</h4>
                        <p class="text-xs text-gray-600 line-clamp-2 leading-relaxed">
                            극단적 선택보다는 중용의 가치가 현대 사회의 성도들에게 더 필요한 덕목일지 모른다. 사랑과 공의 사이에서의 균형...
                        </p>
                        <div class="mt-4 pt-3 border-t border-gray-50 flex items-center justify-between">
                            <div class="flex gap-2">
                                <span class="text-[10px] text-gray-400 flex items-center gap-1"><i data-lucide="tag" class="w-3 h-3"></i> 윤리학</span>
                                <span class="text-[10px] text-gray-400 flex items-center gap-1"><i data-lucide="tag" class="w-3 h-3"></i> 설교아이디어</span>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-xl card-shadow border-l-4 border-slate-300">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold text-gray-500 bg-gray-50 px-2 py-0.5 rounded uppercase">독서 기록</span>
                            <span class="text-[10px] text-gray-400">2024.10.22</span>
                        </div>
                        <h4 class="font-bold text-sm mb-2">고통의 문제: 도스토옙스키를 읽으며</h4>
                        <p class="text-xs text-gray-600 line-clamp-2 leading-relaxed">
                            이반 카라마조프의 질문은 여전히 유효하다. 신정론의 문제는 신학적 설명보다 문학적 서사 속에서 더 깊이...
                        </p>
                        <div class="mt-4 pt-3 border-t border-gray-50 flex items-center justify-between">
                            <div class="flex gap-2">
                                <span class="text-[10px] text-gray-400 flex items-center gap-1"><i data-lucide="tag" class="w-3 h-3"></i> 신정론</span>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCalendar() {
            content.innerHTML = `
                <h3 class="serif text-xl font-bold mb-4">학습 스케줄</h3>
                <div class="bg-white rounded-2xl card-shadow p-4 mb-6">
                    <div class="flex items-center justify-between mb-4 px-2">
                        <button class="p-1 hover:bg-gray-100 rounded"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <h4 class="font-bold text-sm">2024년 10월</h4>
                        <button class="p-1 hover:bg-gray-100 rounded"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center mb-2">
                        <span class="text-[10px] text-red-400 font-bold">일</span>
                        <span class="text-[10px] text-gray-400">월</span>
                        <span class="text-[10px] text-gray-400">화</span>
                        <span class="text-[10px] text-gray-400">수</span>
                        <span class="text-[10px] text-gray-400">목</span>
                        <span class="text-[10px] text-gray-400">금</span>
                        <span class="text-[10px] text-gray-400">토</span>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center font-medium text-xs">
                        <!-- Simplified Calendar Days -->
                        ${Array.from({length: 31}, (_, i) => `
                            <div class="py-2 ${i+1 === 24 ? 'bg-amber-500 text-white rounded-full' : 'hover:bg-gray-50 rounded-full cursor-pointer'}">
                                ${i+1}
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest px-1">오늘의 일정</h4>
                    <div class="flex items-center gap-4 bg-white p-4 rounded-xl border border-gray-100">
                        <div class="w-12 text-center border-r border-gray-100 pr-4">
                            <p class="text-xs text-gray-400">오후</p>
                            <p class="font-bold">2:00</p>
                        </div>
                        <div>
                            <p class="text-sm font-bold">클래식 음악 감상 및 묵상</p>
                            <p class="text-[10px] text-gray-400 italic">바흐 - 마태 수난곡</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 bg-white p-4 rounded-xl border border-gray-100">
                        <div class="w-12 text-center border-r border-gray-100 pr-4">
                            <p class="text-xs text-gray-400">저녁</p>
                            <p class="font-bold">9:30</p>
                        </div>
                        <div>
                            <p class="text-sm font-bold">집중 독서 (인문학 플랜)</p>
                            <p class="text-[10px] text-gray-400 italic">니코마코스 윤리학 p.200 - 250</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLounge() {
            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="serif text-xl font-bold">지혜의 광장</h3>
                    <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                </div>
                
                <div class="space-y-4">
                    <!-- Community Post -->
                    <div class="bg-white p-5 rounded-2xl card-shadow border border-gray-100">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-8 h-8 rounded-full bg-slate-200"></div>
                            <div>
                                <p class="text-xs font-bold italic">정 목사님 <span class="text-[10px] font-normal text-gray-400 not-italic ml-1">3시간 전</span></p>
                                <p class="text-[10px] text-amber-600">학습 주제: 포스트모더니즘</p>
                            </div>
                        </div>
                        <p class="text-sm font-bold mb-2">해체주의 철학이 설교에 주는 시사점이 무엇일까요?</p>
                        <p class="text-xs text-gray-600 leading-relaxed mb-4">
                            데리다의 텍스트 해체를 읽으면서, 우리가 성경 텍스트를 대할 때 가지는 선입견에 대해 고민하게 되었습니다...
                        </p>
                        <div class="flex gap-4 pt-3 border-t border-gray-50 text-[10px] font-bold text-gray-400">
                            <span class="flex items-center gap-1"><i data-lucide="thumbs-up" class="w-3 h-3"></i> 8</span>
                            <span class="flex items-center gap-1"><i data-lucide="message-circle" class="w-3 h-3"></i> 15</span>
                            <span class="flex items-center gap-1"><i data-lucide="bookmark" class="w-3 h-3"></i> 저장</span>
                        </div>
                    </div>

                    <!-- Recommended Course -->
                    <div class="bg-slate-800 p-5 rounded-2xl text-white">
                        <h4 class="serif text-lg font-bold mb-1">인문학 세미나 안내</h4>
                        <p class="text-xs text-slate-400 mb-4 font-light italic">"미술사로 보는 기독교 영성"</p>
                        <div class="flex items-center justify-between">
                            <div class="flex -space-x-2">
                                <div class="w-6 h-6 rounded-full border-2 border-slate-800 bg-slate-400"></div>
                                <div class="w-6 h-6 rounded-full border-2 border-slate-800 bg-slate-500"></div>
                                <div class="w-6 h-6 rounded-full border-2 border-slate-800 bg-slate-600"></div>
                                <div class="w-6 h-6 rounded-full border-2 border-slate-800 bg-slate-700 flex items-center justify-center text-[8px]">+12</div>
                            </div>
                            <button class="bg-amber-600 text-white text-[10px] font-bold px-4 py-2 rounded-lg">참여 신청</button>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
